name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require Docker for the integration contract
        run: docker info
      - name: Compile, test and package
        run: mvn -B -ntp clean verify
      - name: Audit runtime dependencies
        run: |
          mvn -B -ntp org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -Dscope=runtime -DoutputType=json -DoutputFile=target/dependency-tree.json
          node scripts/audit-dependencies.mjs
      - name: Scan source for secrets
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner
      - name: Validate Compose and build application image
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example build
      - name: Compose smoke test
        run: |
          node scripts/init-local-env.mjs
          docker compose up -d --wait --wait-timeout 180
          node scripts/smoke.mjs
      - name: Stop smoke environment
        if: always()
        run: docker compose --env-file .env.example down --volumes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            target/surefire-reports/*.xml
            target/failsafe-reports/*.xml
            target/dependency-audit.json
